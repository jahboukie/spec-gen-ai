name: Quality Gauntlet

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  setup:
    name: Setup & Install Dependencies  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      # Temporarily disabled during Next.js 14 migration
      # - name: Check TypeScript
      #   run: npm run type-check

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm run test:unit

      - name: Check coverage threshold
        run: npm run test:coverage

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [setup, lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "dummy-secret"
          GEMINI_API_KEY: "dummy-key"

  quality-check:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, build]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Unit tests result: ${{ needs.unit-tests.result }}"
          echo "Build result: ${{ needs.build.result }}"
          
          if [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.unit-tests.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ Quality Gauntlet PASSED"
            echo "All quality checks passed successfully. PR is ready for review."
          else
            echo "❌ Quality Gauntlet FAILED"
            echo "One or more quality checks failed. Please review and fix issues before merging."
            exit 1
          fi